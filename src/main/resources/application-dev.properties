# Perfil dev: HSM simulado/lab, timeouts cortos para feedback rapido, logging detallado.
hsm.thales.nodes=localhost:1500
hsm.thales.connect-timeout=2s
hsm.thales.request-timeout=3s

logging.level.com.hsmclient=DEBUG
logging.level.com.hsmclient.infrastructure.thales.transport=TRACE

# Luna en modo mock: JCE software, sin hardware ni cliente PKCS#11 real. Util para desarrollar
# localmente el flujo de GenericCryptoPort. TODO: cuando tengas un Luna real (o su simulador),
# poner mock-mode=false y completar pkcs11-config-path/key-store-password - ver
# docs/LUNA_SETUP_CHECKLIST.md.
hsm.luna.enabled=true
hsm.luna.mock-mode=true
