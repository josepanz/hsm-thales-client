# Perfil prod: todo lo sensible/ambiente-especifico viene de variables de entorno,
# nunca hardcodeado ni commiteado. Ver docs/SECURITY_FINDINGS.md sobre por que el
# cliente original guardaba material de llaves en un keys.properties plano en el deploy.
hsm.thales.nodes=${HSM_THALES_NODES}
hsm.thales.connect-timeout=${HSM_THALES_CONNECT_TIMEOUT:5s}
hsm.thales.request-timeout=${HSM_THALES_REQUEST_TIMEOUT:5s}
hsm.thales.health-check-interval=${HSM_THALES_HEALTH_CHECK_INTERVAL:30s}

hsm.luna.enabled=${HSM_LUNA_ENABLED:false}
# mock-mode SIEMPRE false en prod - si esto quedara en true por error, el "HSM" seria JCE
# software corriendo en la memoria de esta app. No hay variable de entorno para esto a proposito.
hsm.luna.mock-mode=false
hsm.luna.pkcs11-config-path=${HSM_LUNA_PKCS11_CONFIG_PATH:}
hsm.luna.key-store-password=${HSM_LUNA_KEYSTORE_PASSWORD:}

management.endpoint.health.show-details=never
logging.level.com.hsmclient=INFO
