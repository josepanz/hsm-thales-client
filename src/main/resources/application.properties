spring.application.name=hsm-thales-client

# --- HSM Thales (payShield 9000/10000, modo Variant LMK) ---
# Lista de nodos "host:port". Mas de uno habilita failover round-robin.
hsm.thales.nodes=localhost:1500
hsm.thales.connect-timeout=5s
hsm.thales.request-timeout=5s
hsm.thales.socket-timeout-millis=900000
hsm.thales.health-check-interval=30s

# --- Thales Luna (JCE/PKCS11) - deshabilitado por defecto, ver docs/THALES_9000_10K_LUNA.md ---
# y docs/LUNA_SETUP_CHECKLIST.md para el paso a paso mock -> hardware real.
hsm.luna.enabled=false
hsm.luna.mock-mode=false
hsm.luna.pkcs11-config-path=/etc/hsm/pkcs11-luna.cfg

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Nunca loguear el body de las requests/responses HTTP: contienen llaves cifradas y PIN blocks.
logging.level.com.hsmclient=INFO
